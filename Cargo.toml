[package]
name = "tbrowser"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.88"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
url = "2"
anyhow = "1"
dirs = "7"
form_urlencoded = "1"
async-trait = "0.1.92"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
zstd = "0.13"
bytes = "1"
indextree = "4.9.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
