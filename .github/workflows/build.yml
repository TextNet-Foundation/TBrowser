name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тега, например v1.0.0

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: tbrowser
            archive: tbrowser-linux-x86_64.tar.gz
          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-gnu
            bin: tbrowser.exe
            archive: tbrowser-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # Для Windows-раннера устанавливаем mingw-w64 (для GNU-таргета)
      - name: Install mingw-w64 (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH
        shell: bash

      # Указываем линкер для Windows GNU-таргета
      - name: Configure linker (Windows GNU)
        if: matrix.platform.os == 'windows-latest'
        run: |
          echo '[target.x86_64-pc-windows-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
        shell: bash

      - name: Build release
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Strip binary (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: strip target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }}

      - name: Archive binary (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czf ${{ matrix.platform.archive }} ${{ matrix.platform.bin }}
          mv ${{ matrix.platform.archive }} ../../..

      - name: Archive binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release
          Compress-Archive -Path ${{ matrix.platform.bin }} -DestinationPath ${{ matrix.platform.archive }}
          mv ${{ matrix.platform.archive }} ../../..
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.archive }}
          path: ${{ matrix.platform.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}